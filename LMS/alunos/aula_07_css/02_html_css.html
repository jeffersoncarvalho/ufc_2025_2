<!DOCTYPE html>
<html lang="pt-br">
<head>
<style>
    h1, p {
        background-color: aquamarine;
    }

    p {
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    h1, h2, h3, span[id="titulo"] { 
        color:red;
    } 

    #ad > li.important, strong { 
        text-decoration: underline; 
        color: orange; 
    } 


</style>
</head>
<body>
    <h1>Agrupamento de Seletores</h1>

    <p>
        Lorem <span id="titulo">ipsum</span> dolor sit amet, consectetur adipisicing elit. Quas iste quam a quibusdam, minus nulla atque nam voluptas consectetur beatae quae consequatur nihil dolorum, fuga, qui libero vel! Culpa, aperiam!
    </p>

    <hr />
    <div >
        <ul id="ad">
            <li>Item 1</li>
            <li class="important"><strong>Item</strong> 2</li>
            <li>Item 3</li>
        </ul>
    </div>
</body>
</html>
